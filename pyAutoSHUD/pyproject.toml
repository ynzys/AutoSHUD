[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyautoshud"
version = "1.0.0"
description = "Python-based automated hydrological model deployment tool for SHUD"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AutoSHUD Contributors"}
]
keywords = ["hydrology", "modeling", "SHUD", "watershed", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "geopandas>=0.10.0",
    "rasterio>=1.2.0",
    "shapely>=1.8.0",
    "fiona>=1.8.0",
    "pyproj>=3.2.0",
    "xarray>=0.19.0",
    "netCDF4>=1.5.0",
    "h5netcdf>=0.11.0",
    "triangle>=20200424",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "pyyaml>=5.4.0",
    "click>=8.0.0",
    "tqdm>=4.62.0",
    "loguru>=0.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.910",
    "isort>=5.9",
]
calibration = [
    "spotpy>=1.5.0",
    "deap>=1.3.0",
]
viz = [
    "cartopy>=0.20.0",
    "plotly>=5.0.0",
]
all = [
    "pyautoshud[dev,calibration,viz]"
]

[project.scripts]
pyautoshud = "pyautoshud.cli:main"

[project.urls]
Homepage = "https://github.com/SHUD-System/pyAutoSHUD"
Documentation = "https://pyautoshud.readthedocs.io"
Repository = "https://github.com/SHUD-System/pyAutoSHUD"
Issues = "https://github.com/SHUD-System/pyAutoSHUD/issues"

[tool.setuptools]
packages = ["pyautoshud"]

[tool.setuptools.package-data]
pyautoshud = ["data/*.csv", "data/*.yaml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=pyautoshud --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
